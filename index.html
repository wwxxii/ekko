<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EKKO 宜蘭派對服務｜生啤、調酒與現場演出整合</title>
<meta name="description" content="EKKO 提供宜蘭聚會與派對整合服務，包含現拉生啤、派對調酒、DJ 與現場演出，並提供民宿業者合作方案。">
<meta name="robots" content="index,follow">
<meta property="og:locale" content="zh_TW">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EKKO">
<meta property="og:title" content="EKKO 宜蘭派對服務｜生啤、調酒與現場演出整合">
<meta property="og:description" content="整合現拉生啤、派對調酒、DJ 與現場演出，讓宜蘭的每一次聚會更完整。">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="EKKO 宜蘭派對服務">
<meta name="twitter:description" content="現拉生啤、派對調酒、DJ 與現場演出整合服務。">
<meta name="twitter:image" content="網頁用圖/EKKO_朋友相聚主視覺.png">
<meta name="theme-color" content="#090a0c">
<style>
:root{--black:#090a0c;--silver:#dfe3e7;--muted:#a7adb4;--cyan:#62dff2;--violet:#a68bd4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;background:var(--black);color:#fff;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{min-height:100svh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.nav{height:78px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #ffffff1c;background:#090a0ce8;backdrop-filter:blur(14px)}
.nav img{width:142px;max-height:46px;object-fit:contain;filter:invert(1)}
main{position:relative;min-height:calc(100svh - 78px);display:grid;place-items:center;padding:54px 24px 64px;overflow:hidden}
main:before,main:after{content:"";position:absolute;width:42vw;height:42vw;border-radius:50%;filter:blur(80px);opacity:.12;pointer-events:none}
main:before{left:-18vw;top:-12vw;background:var(--cyan)}
main:after{right:-18vw;bottom:-18vw;background:var(--violet)}
.wrap{position:relative;z-index:1;width:min(1120px,100%)}
.intro{text-align:center;margin:0 auto 38px}
.eyebrow{margin:0 0 12px;color:var(--silver);font-size:12px;font-weight:800;letter-spacing:.32em}
h1{margin:0;font-size:72px;line-height:1.12;letter-spacing:-.04em;text-wrap:balance}
.intro p{margin:16px auto 0;color:var(--muted);font-size:16px;line-height:1.8}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.choice{position:relative;isolation:isolate;min-height:430px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:34px;border:1px solid #ffffff30;border-radius:26px;background-position:center;background-size:cover;box-shadow:0 28px 70px #0008;transition:transform .3s ease,border-color .3s ease}
.choice:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(0deg,#050607fa 3%,#090a0ccf 42%,#090a0c2b 82%)}
.choice:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px #ffffff30;pointer-events:none}
.choice:hover{transform:translateY(-6px);border-color:#ffffff6b}
.choice-business{background-image:url('網頁用圖/EKKO_二孔四孔生啤機_背景圖.png')}
.choice-customer{background-image:url('網頁用圖/EKKO_朋友相聚主視覺.png')}
.label{color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:.18em}
.choice-customer .label{color:#c8b7e6}
h2{margin:10px 0;font-size:clamp(30px,4vw,46px);line-height:1.12}
.choice p{max-width:460px;margin:0;color:#cdd2d7;font-size:15px;line-height:1.75}
.enter{width:max-content;margin-top:24px;padding:12px 18px;border-radius:999px;background:linear-gradient(118deg,#555c63,#f4f6f7 28%,#9299a0 52%,#e3e6e9 74%,#697077);color:#090a0c;font-size:14px;font-weight:900}
.brand-hero{position:relative;min-height:calc(100svh - 78px);display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 28%,#fff,#e9ebed 45%,#b7bdc3 100%)}
.brand-hero:after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 18%,#ffffffb5 40%,#737b8335 57%,transparent 76%);animation:brand-shine 7s ease-in-out infinite;pointer-events:none}
.brand-stage{position:relative;z-index:1;padding:24px;text-align:center}
.brand-logo-frame{width:min(570px,80vw);margin:auto;opacity:0;filter:blur(12px);transform:translateY(18px) scale(.94);animation:brand-logo-in 1.15s cubic-bezier(.22,1,.36,1) .15s forwards}
.brand-logo-frame img{display:block;width:100%;height:auto;transform-origin:center;animation:brand-logo-breathe 1.15s ease-out .15s both}
.brand-kicker{margin-top:18px;color:#596067;font-size:12px;font-weight:900;letter-spacing:.3em}
.brand-stage>p{margin:24px 0 0;color:#4f555b;font-size:clamp(18px,2vw,25px);font-weight:750;letter-spacing:.08em;opacity:0;transform:translateY(12px);animation:brand-copy-in .7s ease-out 1s forwards}
.brand-scroll{position:absolute;z-index:2;bottom:26px;color:#596067;font-size:10px;font-weight:900;letter-spacing:.26em;opacity:0;transform:translateY(12px);animation:brand-copy-in .7s ease-out 1.3s forwards}
@keyframes brand-shine{50%{transform:translateX(12%)}}
@keyframes brand-logo-in{to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}
@keyframes brand-logo-breathe{0%{filter:brightness(.7)}65%{filter:brightness(1.22)}100%{filter:brightness(1)}}
@keyframes brand-copy-in{to{opacity:1;transform:translateY(0)}}
.story{position:relative;min-height:calc(100svh - 78px);display:grid;align-items:center;padding:96px 24px;overflow:hidden;background:linear-gradient(90deg,#050607f2 0%,#090a0cdd 48%,#090a0c85 100%),url('網頁用圖/EKKO_朋友相聚主視覺.png') 62% center/cover}
.story:after{content:"EKKO";position:absolute;right:-.04em;bottom:-.22em;color:#ffffff0a;font-size:clamp(150px,28vw,430px);font-weight:950;letter-spacing:-.08em;line-height:1;pointer-events:none}
.story-inner{position:relative;z-index:1;width:min(1120px,100%);margin:auto}
.story-copy{max-width:820px}
.story .eyebrow{color:var(--cyan)}
.story h2{margin:0;font-size:72px;line-height:1.08;letter-spacing:-.055em;text-wrap:balance}
.story-title-logo{display:block;width:clamp(220px,29vw,330px);height:auto;margin:0 0 18px;filter:invert(1) brightness(1.25)}
.story-line{display:block}
.story-lead{max-width:900px;margin:24px 0 0;color:var(--cyan);font-size:26px;font-weight:800;line-height:1.45;letter-spacing:.02em}
.service-line{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.service-line span{padding:9px 13px;border:1px solid #ffffff38;border-radius:999px;background:#090a0c99;color:#e7eaed;font-size:12px;font-weight:850;letter-spacing:.08em}
@media(max-width:720px){main{padding:38px 16px 42px}
.intro h1{font-size:46px}
.story h2{font-size:72px}
.intro{margin-bottom:26px}
.intro p{font-size:14px}
.choices{grid-template-columns:1fr}
.choice{min-height:330px;padding:26px}
.choice-customer{background-position:62% center}
.story{padding:76px 18px;background-position:68% center}
.story-lead{font-size:20px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
.choice{transition:none}
.brand-hero:after,.brand-logo-frame,.brand-logo-frame img,.brand-stage>p,.brand-scroll{animation:none}
.brand-logo-frame,.brand-stage>p,.brand-scroll{opacity:1;filter:none;transform:none}
}

</style>
</head>
<body>
<header class="nav">
<img src="商標/logo-transparent.png" alt="EKKO">
</header>
<section class="brand-hero" aria-label="EKKO 品牌首頁">
<div class="brand-stage">
<div class="brand-logo-frame"><img src="商標/logo-transparent.png" alt="EKKO — Echoes Better Together"></div>
<p>住宿、活動與娛樂整合服務</p>
</div>
<a class="brand-scroll" href="#why-ekko">SCROLL</a>
</section>
<section class="story" id="why-ekko" aria-labelledby="story-title">
<div class="story-inner">
<div class="story-copy">
<p class="eyebrow">WHY EKKO</p>
<h2 id="story-title"><img class="story-title-logo" src="商標/logo-transparent.png" alt="EKKO"><span class="story-line">提供的服務有哪些</span></h2>
<p class="story-lead">
<span class="story-line">EKKO 負責整合所有活動娛樂服務，</span>
<span class="story-line">酒水、氣氛與現場演出不必再分頭尋找。</span>
</p>
<div class="service-line" aria-label="EKKO 整合服務">
<span>現拉生啤</span>
<span>派對調酒</span>
<span>DJ</span>
<span>現場演出</span>
</div>
</div>
</div>
</section>
<main>
<div class="wrap">
<div class="intro">
<p class="eyebrow">CHOOSE YOUR EKKO</p>
<h1>你想找哪一種服務？</h1>
</div>
<div class="choices">
<a class="choice choice-business" href="stay.html" aria-label="我是住宿業者，我想合作">
<span class="label">FOR STAY PARTNERS</span>
<h2>我是住宿業者，<br>我想合作</h2>
<p>從既有訂房，延伸更多加購收入。</p>
<span class="enter">查看合作方式 →</span>
</a>
<a class="choice choice-customer" href="customer.html" aria-label="我想辦活動">
<span class="label">FOR EVERY CELEBRATION</span>
<h2>我想辦活動</h2>
<p>把酒水跟活動娛樂都交給 EKKO 整合服務</p>
<span class="enter">查看活動服務 →</span>
</a>
</div>
</div>
</main>
</body>
</html>
